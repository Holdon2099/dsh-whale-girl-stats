<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="wgsIconTitle">
  <title id="wgsIconTitle">Whale Girl Stats - deep sea rice bowl</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#10305a"/>
      <stop offset="0.55" stop-color="#0a1e38"/>
      <stop offset="1" stop-color="#05101f"/>
    </linearGradient>
    <radialGradient id="seaGlow" cx="0.5" cy="0.45" r="0.58">
      <stop offset="0" stop-color="#2f86bd" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2f86bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3f4ff"/>
      <stop offset="0.45" stop-color="#7ad6f5"/>
      <stop offset="1" stop-color="#3b9bd6"/>
    </linearGradient>
    <linearGradient id="riceGrad" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#d8e4f1"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7fc"/>
      <stop offset="0.4" stop-color="#c3d2e1"/>
      <stop offset="1" stop-color="#8095a9"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfdcea"/>
      <stop offset="0.3" stop-color="#a4b8ca"/>
      <stop offset="0.62" stop-color="#7e93a7"/>
      <stop offset="1" stop-color="#4a5f73"/>
    </linearGradient>
  </defs>

  <!-- deep sea rounded tile -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bgGrad)"/>
  <circle cx="32" cy="33" r="26" fill="url(#seaGlow)"/>

  <!-- whale fluke rising behind the bowl -->
  <path fill="url(#tailGrad)" d="M32 22
    C29 20.2 25 18.4 21 16.6
    C17 14.8 12.6 13.4 8.6 12.9
    C10.4 17.6 14.2 21.6 19.4 24.2
    C23.4 26.2 27.6 27.4 30.8 27.8
    L30.8 30.6 L33.2 30.6 L33.2 27.8
    C36.4 27.4 40.6 26.2 44.6 24.2
    C49.8 21.6 53.6 17.6 55.4 12.9
    C51.4 13.4 47 14.8 43 16.6
    C39 18.4 35 20.2 32 22 Z"/>

  <!-- steel bowl -->
  <path fill="url(#bowlGrad)" d="M11.4 44 C11.4 53.6 18.6 58.9 32 58.9 C45.4 58.9 52.6 53.6 52.6 44 C52.6 46.6 42.6 48.3 32 48.3 C21.4 48.3 11.4 46.6 11.4 44 Z"/>
  <path d="M14.6 46.9 C16.6 51.8 21.6 55.4 27.6 56.6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.35"/>
  <ellipse cx="32" cy="44" rx="20.6" ry="4.5" fill="url(#rimGrad)"/>
  <ellipse cx="32" cy="44" rx="20.6" ry="4.5" fill="none" stroke="#5b7085" stroke-width="1.1" stroke-opacity="0.85"/>
  <path d="M13.2 42.8 C19 40.6 45 40.6 50.8 42.8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- rice heap overflowing the rim -->
  <path fill="url(#riceGrad)" d="M15.6 43 C15.6 34.6 23.2 29.6 32 29.6 C40.8 29.6 48.4 34.6 48.4 43 C40.4 45.9 23.6 45.9 15.6 43 Z"/>
  <path d="M16.2 43.6 C24 46.5 40 46.5 47.8 43.6" fill="none" stroke="#7f93a7" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.45"/>
</svg>
